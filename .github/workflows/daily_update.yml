name: Uppdatera Rabattlista Dagligen

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "45 4 * * *"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Hämta veckans reklamblad och bygg rabattlistan
        run: python3 update_cloud_page.py

      - name: Publicera till gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd public
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Uppdaterad rabattlista $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
